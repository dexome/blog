baseURL: http://localhost:1313/
languageCode: en-us
defaultContentLanguage: en
theme: congo
title: Dexome

# Mount only content + static so the project's Stack-specific layouts/ and
# assets/ do NOT leak into this preview — Congo uses its own templates.
module:
  mounts:
    - source: content/en
      target: content
    - source: static
      target: static
    - source: preview/empty
      target: layouts

pagination:
  pagerSize: 10

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  colorScheme: auto
  defaultAppearance: dark
  autoSwitchAppearance: true
  mainSections:
    - post
  homepage:
    layout: profile
    showRecent: true
    showRecentItems: 10
    showMoreLink: true
    showMoreLinkDest: /post/
    cardView: true
  showReadingTime: true
  showDateUpdated: true
  showTableOfContents: true
  article:
    showComments: false

  author:
    name: dexter
    links:
      - github: https://github.com/jahanarun
      - linkedin: https://www.linkedin.com/in/jahanarun
