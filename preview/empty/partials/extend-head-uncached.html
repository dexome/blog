{{- if .HasShortcode "mermaid" -}}
<style>
    .diagram-wrap {
        position: relative;
    }

    .diagram-wrap pre.mermaid {
        overflow-x: auto;
    }

    .diagram-expand-btn {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 1px solid rgba(100, 116, 139, 0.6);
        border-radius: 0.35rem;
        background: rgba(255, 255, 255, 0.85);
        color: #172554;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s ease, background 0.15s ease;
    }

    .diagram-wrap:hover .diagram-expand-btn,
    .diagram-expand-btn:focus-visible {
        opacity: 1;
    }

    .diagram-expand-btn:hover {
        background: #ffffff;
    }

    .diagram-expand-btn svg {
        width: 1.1rem;
        height: 1.1rem;
    }

    .diagram-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: rgba(15, 23, 42, 0.85);
    }

    .diagram-modal.is-open {
        display: flex;
    }

    .diagram-modal-content {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
    }

    .diagram-modal-content.is-panning {
        cursor: grabbing;
    }

    .diagram-modal-content svg {
        transform-origin: center center;
        background: #ffffff;
        border-radius: 0.4rem;
        padding: 1rem;
        max-width: none;
    }

    .diagram-modal-close {
        position: fixed;
        top: 1.2rem;
        right: 1.6rem;
        z-index: 1001;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        color: #172554;
        font-size: 1.8rem;
        line-height: 1;
        cursor: pointer;
    }

    .diagram-modal-close:hover {
        background: #ffffff;
    }

    .diagram-modal-hint {
        position: fixed;
        bottom: 1.2rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1001;
        padding: 0.4rem 1rem;
        border-radius: 0.4rem;
        background: rgba(255, 255, 255, 0.9);
        color: #172554;
        font-size: 0.8rem;
    }
</style>
<script>
    (function () {
        const EXPAND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>';

        function buildModal() {
            const modal = document.createElement("div");
            modal.className = "diagram-modal";
            modal.innerHTML =
                '<button type="button" class="diagram-modal-close" aria-label="Close diagram">&times;</button>' +
                '<div class="diagram-modal-content"></div>' +
                '<div class="diagram-modal-hint">Scroll to zoom &middot; drag to pan &middot; Esc to close</div>';
            document.body.appendChild(modal);

            const content = modal.querySelector(".diagram-modal-content");
            const closeBtn = modal.querySelector(".diagram-modal-close");
            let scale = 1;
            let currentSvg = null;

            function applyScale() {
                if (currentSvg) {
                    currentSvg.style.transform = "scale(" + scale + ")";
                }
            }

            function fitToView() {
                if (!currentSvg) return;
                const prev = currentSvg.style.transform;
                currentSvg.style.transform = "none";
                const sw = currentSvg.getBoundingClientRect().width;
                const sh = currentSvg.getBoundingClientRect().height;
                currentSvg.style.transform = prev;
                const cw = content.clientWidth - 32;
                const ch = content.clientHeight - 32;
                if (sw > 0 && sh > 0) {
                    scale = Math.min(cw / sw, ch / sh, 1);
                    scale = Math.max(scale, 0.1);
                    applyScale();
                }
            }

            function open(svg) {
                currentSvg = svg.cloneNode(true);
                currentSvg.style.width = "auto";
                currentSvg.style.height = "auto";
                currentSvg.style.maxWidth = "none";
                scale = 1;
                applyScale();
                content.innerHTML = "";
                content.appendChild(currentSvg);
                content.scrollTop = 0;
                content.scrollLeft = 0;
                modal.classList.add("is-open");
                document.body.style.overflow = "hidden";
                requestAnimationFrame(fitToView);
            }

            function close() {
                modal.classList.remove("is-open");
                document.body.style.overflow = "";
                content.innerHTML = "";
                currentSvg = null;
            }

            closeBtn.addEventListener("click", close);
            modal.addEventListener("click", (e) => {
                if (e.target === modal) close();
            });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && modal.classList.contains("is-open")) close();
            });

            content.addEventListener("wheel", (e) => {
                if (!currentSvg) return;
                e.preventDefault();
                scale += e.deltaY < 0 ? 0.1 : -0.1;
                scale = Math.min(Math.max(scale, 0.4), 5);
                applyScale();
            }, { passive: false });

            let isPanning = false;
            let startX = 0, startY = 0, scrollLeft = 0, scrollTop = 0;
            content.addEventListener("mousedown", (e) => {
                isPanning = true;
                content.classList.add("is-panning");
                startX = e.pageX;
                startY = e.pageY;
                scrollLeft = content.scrollLeft;
                scrollTop = content.scrollTop;
            });
            window.addEventListener("mouseup", () => {
                isPanning = false;
                content.classList.remove("is-panning");
            });
            content.addEventListener("mousemove", (e) => {
                if (!isPanning) return;
                e.preventDefault();
                content.scrollLeft = scrollLeft - (e.pageX - startX);
                content.scrollTop = scrollTop - (e.pageY - startY);
            });

            return { open };
        }

        function init() {
            const diagrams = document.querySelectorAll("pre.mermaid");
            if (!diagrams.length) return;
            const modal = buildModal();

            diagrams.forEach((pre) => {
                if (pre.parentElement && pre.parentElement.classList.contains("diagram-wrap")) return;
                const wrap = document.createElement("div");
                wrap.className = "diagram-wrap";
                pre.parentNode.insertBefore(wrap, pre);
                wrap.appendChild(pre);

                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "diagram-expand-btn";
                btn.setAttribute("aria-label", "Expand diagram");
                btn.innerHTML = EXPAND_ICON;
                btn.addEventListener("click", () => {
                    const svg = pre.querySelector("svg");
                    if (svg) modal.open(svg);
                });
                wrap.appendChild(btn);
            });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    })();
</script>
{{- end -}}
