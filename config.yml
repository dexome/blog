baseURL: https://blog.dexome.com/
locale: en-US
defaultContentLanguage: en
contentDir: content/en
theme: congo
title: Dexome
enableRobotsTXT: true

# Share the tested Congo presentation without loading the old Stack overrides.
module:
  mounts:
    - source: content/en/post
      target: content/post
    - source: preview/congo/content
      target: content
    - source: static
      target: static
    - source: preview/congo/layouts
      target: layouts
    - source: layouts/shortcodes/mermaid.html
      target: layouts/_shortcodes/mermaid.html
    - source: preview/congo/assets
      target: assets
    - source: preview/congo/data
      target: data

minify:
  disableXML: true
  minifyOutput: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

params:
  description: Practical notes on NixOS, containers, networking, and local AI. Real failures, working fixes, and the reasoning behind them.
  colorScheme: avocado
  defaultAppearance: light
  autoSwitchAppearance: true
  enableSearch: true
  enableCodeCopy: true
  dateFormat: 2 Jan 2006
  mainSections:
    - post
  homepage:
    layout: custom
  header:
    layout: basic
  footer:
    showAppearanceSwitcher: true
  article:
    showAuthor: false
    showDateUpdated: true
    showTableOfContents: true
    showComments: true
    license:
      enabled: true
      default: Licensed under CC BY-NC-SA 4.0
  list:
    showSummary: true
  author:
    name: Jahan Arun J
    links:
      - github: https://github.com/jahanarun
      - linkedin: https://www.linkedin.com/in/jahanarun
  analytics:
    enabled: true
  comments:
    enabled: true
    provider: giscus
    giscus:
      repo: "dexome/blog"
      repoID: "R_kgDOGoNOmQ"
      category: "Announcements"
      categoryID: "DIC_kwDOGoNOmc4DLkhR"
      # Match the article title without Congo's browser-title suffix.
      mapping: "specific"
      strict: 0
      lightTheme: "light"
      darkTheme: "dark_dimmed"
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: "top"
      lang: "en"

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    tabWidth: 4

menus:
  main:
    - name: Writing
      pageRef: /post
      weight: 10
    - name: Topics
      pageRef: /topics
      weight: 20
    - name: About
      pageRef: /about
      weight: 30
    - name: RSS
      url: /index.xml
      weight: 40
    - name: Search
      identifier: search
      weight: 50
      params:
        action: search
  footer:
    - name: GitHub
      url: https://github.com/jahanarun
      weight: 10
    - name: LinkedIn
      url: https://www.linkedin.com/in/jahanarun
      weight: 20
    - name: RSS
      url: /index.xml
      weight: 30
